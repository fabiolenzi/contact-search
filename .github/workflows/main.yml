# Deploy the production site and the v0.2 preview together to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'v0.2']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: v0.2
          path: preview-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            main-source/yarn.lock
            preview-source/yarn.lock

      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install production dependencies
        working-directory: main-source
        run: yarn install --frozen-lockfile

      - name: Build production site
        working-directory: main-source
        run: yarn build

      - name: Install preview dependencies
        working-directory: preview-source
        run: yarn install --frozen-lockfile

      - name: Build preview site
        working-directory: preview-source
        run: yarn build

      - name: Combine production and preview sites
        run: |
          mkdir -p site/preview
          cp -R main-source/dist/. site/
          cp -R preview-source/dist/. site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
